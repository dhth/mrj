[package]
name = "mrj"
version = "0.6.0-alpha.1"
edition = "2024"
authors = ["Dhruv Thakur"]
repository = "https://github.com/dhth/mrj"
description = "mrj merges your open dependency upgrade PRs"
homepage = "https://tools.dhruvs.space/mrj"
license = "MIT"
keywords = [
    "cli",
    "github",
]
categories = [
    "command-line-utilities",
]
exclude = [
    ".github",
    "AGENTS.md",
]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
futures = "0.3.34"
octocrab = "0.49.7"
open = "5.4.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tera = "1.20.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
toml = { version = "1.1.6", features = ["parse"] }

[dev-dependencies]
insta = { version = "1.48.0", features = ["yaml"] }
insta-cmd = "0.7.0"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
